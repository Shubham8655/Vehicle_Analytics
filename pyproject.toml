[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-analytics-pipeline"
version = "1.0.0"
description = "Python vehicle detection, line-crossing analytics, and live dashboard"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "opencv-python>=4.10,<5.0",
  "ultralytics>=8.3,<9.0",
  "lap>=0.5.12,<1.0",
  "jinja2>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "imageio-ffmpeg>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["vehicle_analytics*"]
