services:
  postgres:
    image: postgres:16-alpine
    container_name: vehicle-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicle_analytics
      POSTGRES_USER: vehicle_analytics
      POSTGRES_PASSWORD: vehicle_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle_analytics -d vehicle_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: vehicle-analytics-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx", "/mediamtx.yml"]

volumes:
  postgres_data:
